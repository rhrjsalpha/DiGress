# Training settings
n_epochs: 1000
batch_size: 1 # 512
lr: 0.0002
clip_grad: null          # float, null to disable
save_model: True
num_workers: 0
ema_decay: 0           # 'Amount of EMA decay, 0 means off. A reasonable value  is 0.999.'
progress_bar: false
weight_decay: 1e-12
optimizer: adamw # adamw,nadamw,nadam => nadamw for large batches, see http://arxiv.org/abs/2102.06356 for the use of nesterov momentum with large batches
seed: 0
lambda_train: [1.0, 0.0]
y_loss_mode: none #
# 조건으로 제시할 y 가 있음
## 조건 y 만 사용시
### none
## y를 학습시킨 예측기를 이용하여 가이던스 제시할 목적
### 회귀모델 : mse
### 분류모델 : ce, (y_num_classes: 8 이것도 정의)